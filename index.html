<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <!-- 初期ページタイトル -->
  <title>音楽プレイヤー</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f5f5f7;

      color: #1d1d1f;

    }


    .player {

      width: 100%;

      max-width: 520px;

      background: white;

      border-radius: 24px;

      padding: 30px;

      box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.10);

    }


    /* ファイル選択 */

    .file-area {

      text-align: center;

      margin-bottom: 30px;

    }


    #fileInput {

      display: none;

    }


    .file-button {

      display: inline-block;

      padding: 12px 20px;

      background: #007aff;

      color: white;

      border-radius: 12px;

      cursor: pointer;

      font-weight: 600;

      transition: 0.2s;

    }


    .file-button:hover {

      background: #0066d6;

    }


    /* ジャケット風 */

    .album-art {

      width: 220px;

      height: 220px;

      margin: 0 auto 25px;

      border-radius: 20px;

      background:
        linear-gradient(
          135deg,
          #222,
          #555
        );

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 80px;

      color: white;

      box-shadow:
        0 10px 30px rgba(0,0,0,0.15);

    }


    /* 曲情報 */

    .song-info {

      text-align: center;

      margin-bottom: 25px;

    }


    #songTitle {

      margin: 0;

      font-size: 21px;

      font-weight: 700;

      word-break: break-word;

    }


    #fileName {

      margin-top: 7px;

      font-size: 13px;

      color: #888;

      word-break: break-word;

    }


    /* シーク */

    .progress-area {

      margin-bottom: 20px;

    }


    #progress {

      width: 100%;

      cursor: pointer;

      accent-color: #007aff;

    }


    .time {

      display: flex;

      justify-content: space-between;

      font-size: 12px;

      color: #777;

      margin-top: 5px;

    }


    /* コントロール */

    .controls {

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 20px;

      margin-bottom: 25px;

    }


    button {

      border: none;

      cursor: pointer;

      background: transparent;

    }


    .side-button {

      font-size: 22px;

      width: 45px;

      height: 45px;

      border-radius: 50%;

    }


    .side-button:hover {

      background: #f0f0f0;

    }


    .play-button {

      width: 65px;

      height: 65px;

      border-radius: 50%;

      background: #007aff;

      color: white;

      font-size: 25px;

      padding-left: 3px;

      box-shadow:
        0 5px 15px rgba(0,122,255,0.3);

    }


    .play-button:hover {

      background: #0066d6;

    }


    /* 音量 */

    .volume-area {

      display: flex;

      align-items: center;

      gap: 10px;

      color: #666;

    }


    #volume {

      flex: 1;

      accent-color: #007aff;

    }


    /* 音声要素 */

    audio {

      display: none;

    }


    /* スマホ */

    @media (max-width: 600px) {

      .player {

        padding: 22px;

        border-radius: 20px;

      }


      .album-art {

        width: 180px;

        height: 180px;

        font-size: 65px;

      }

    }

  </style>

</head>


<body>


  <div class="player">


    <!-- ファイル選択 -->

    <div class="file-area">

      <label
        class="file-button"
        for="fileInput"
      >
        🎵 音楽を選択
      </label>

      <input
        type="file"
        id="fileInput"
        accept="audio/*"
      >

    </div>


    <!-- ジャケット -->

    <div class="album-art">

      🎵

    </div>


    <!-- 曲情報 -->

    <div class="song-info">

      <h1 id="songTitle">
        曲を選択してください
      </h1>

      <div id="fileName">
        音楽ファイルが選択されていません
      </div>

    </div>


    <!-- シークバー -->

    <div class="progress-area">

      <input
        type="range"
        id="progress"
        min="0"
        max="100"
        value="0"
      >

      <div class="time">

        <span id="currentTime">
          0:00
        </span>

        <span id="duration">
          0:00
        </span>

      </div>

    </div>


    <!-- 操作 -->

    <div class="controls">

      <button
        class="side-button"
        id="backButton"
      >
        ⏮
      </button>


      <button
        class="play-button"
        id="playButton"
      >
        ▶
      </button>


      <button
        class="side-button"
        id="nextButton"
      >
        ⏭
      </button>

    </div>


    <!-- 音量 -->

    <div class="volume-area">

      🔊

      <input
        type="range"
        id="volume"
        min="0"
        max="1"
        step="0.01"
        value="1"
      >

    </div>


    <audio id="audio"></audio>


  </div>


  <script>

    const fileInput =
      document.getElementById("fileInput");

    const audio =
      document.getElementById("audio");

    const songTitle =
      document.getElementById("songTitle");

    const fileNameDisplay =
      document.getElementById("fileName");

    const playButton =
      document.getElementById("playButton");

    const progress =
      document.getElementById("progress");

    const currentTimeDisplay =
      document.getElementById("currentTime");

    const durationDisplay =
      document.getElementById("duration");

    const volume =
      document.getElementById("volume");

    const backButton =
      document.getElementById("backButton");

    const nextButton =
      document.getElementById("nextButton");


    let currentURL = null;


    /* -----------------------------
       時間を 0:00 に変換
    ----------------------------- */

    function formatTime(seconds) {

      if (!Number.isFinite(seconds)) {

        return "0:00";

      }


      const minutes =
        Math.floor(seconds / 60);


      const secondsPart =
        Math.floor(seconds % 60)
          .toString()
          .padStart(2, "0");


      return `${minutes}:${secondsPart}`;

    }


    /* -----------------------------
       音楽ファイル選択
    ----------------------------- */

    fileInput.addEventListener(
      "change",
      (event) => {

        const file =
          event.target.files[0];


        if (!file) {

          return;

        }


        /* 古いURLを削除 */

        if (currentURL) {

          URL.revokeObjectURL(currentURL);

        }


        currentURL =
          URL.createObjectURL(file);


        audio.src =
          currentURL;


        /* 拡張子を除いたファイル名 */

        const fullName =
          file.name;


        const title =
          fullName.replace(
            /\.[^/.]+$/,
            ""
          );


        /* 曲名 */

        songTitle.textContent =
          title;


        /* ファイル名 */

        fileNameDisplay.textContent =
          fullName;


        /* ★ ブラウザのページタイトル */

        document.title =
          title;


        /* 読み込み */

        audio.load();


        /* 自動再生 */

        audio.play()
          .catch(() => {});

      }
    );


    /* -----------------------------
       再生 / 一時停止
    ----------------------------- */

    playButton.addEventListener(
      "click",
      () => {

        if (audio.paused) {

          audio.play();

        } else {

          audio.pause();

        }

      }
    );


    /* -----------------------------
       再生状態
    ----------------------------- */

    audio.addEventListener(
      "play",
      () => {

        playButton.textContent =
          "Ⅱ";

      }
    );


    audio.addEventListener(
      "pause",
      () => {

        playButton.textContent =
          "▶";

      }
    );


    /* -----------------------------
       曲の長さ
    ----------------------------- */

    audio.addEventListener(
      "loadedmetadata",
      () => {

        durationDisplay.textContent =
          formatTime(audio.duration);

      }
    );


    /* -----------------------------
       再生位置
    ----------------------------- */

    audio.addEventListener(
      "timeupdate",
      () => {

        currentTimeDisplay.textContent =
          formatTime(audio.currentTime);


        if (audio.duration) {

          progress.value =
            (audio.currentTime /
              audio.duration) * 100;

        }

      }
    );


    /* -----------------------------
       シークバー
    ----------------------------- */

    progress.addEventListener(
      "input",
      () => {

        if (!audio.duration) {

          return;

        }


        audio.currentTime =
          (progress.value / 100)
          * audio.duration;

      }
    );


    /* -----------------------------
       音量
    ----------------------------- */

    volume.addEventListener(
      "input",
      () => {

        audio.volume =
          volume.value;

      }
    );


    /* -----------------------------
       ⏮ 10秒戻る
    ----------------------------- */

    backButton.addEventListener(
      "click",
      () => {

        audio.currentTime =
          Math.max(
            0,
            audio.currentTime - 10
          );

      }
    );


    /* -----------------------------
       ⏭ 10秒進む
    ----------------------------- */

    nextButton.addEventListener(
      "click",
      () => {

        audio.currentTime =
          Math.min(
            audio.duration || 0,
            audio.currentTime + 10
          );

      }
    );


    /* -----------------------------
       曲終了
    ----------------------------- */

    audio.addEventListener(
      "ended",
      () => {

        playButton.textContent =
          "▶";

        progress.value = 0;

      }
    );

  </script>


</body>

</html>
